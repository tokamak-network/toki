<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BUILDERS — City Pop Art Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@700;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#20242c}
  body{min-height:100vh;display:grid;place-items:center;font-family:"Archivo",sans-serif;padding:40px 0}
  .poster{width:1080px;background:#f3efe4;padding:44px 44px 52px;position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.5)}
  /* faint paper grain */
  .poster::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:multiply;
    background-image:radial-gradient(#000 12%,transparent 13%);background-size:3px 3px}

  /* ── TITLE BLOCK ── */
  .micro{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
  .micro .jp{font-family:"Noto Sans JP";font-weight:900;font-size:26px;letter-spacing:.18em;color:#1a1a1a}
  .micro .tag{font-family:"Archivo";font-weight:900;font-size:15px;letter-spacing:.22em;color:#c1452e;padding-bottom:5px}
  .title{font-family:"Archivo Black";font-size:158px;line-height:.86;letter-spacing:-.01em;color:#141414;
    -webkit-text-stroke:1px #141414}
  .rule{height:6px;background:#141414;margin:14px 0 0}
  .subrow{display:flex;align-items:stretch;margin-top:0;border-bottom:2px solid #141414}
  .subrow .cell{flex:1;padding:11px 16px 12px;font-family:"Archivo";font-weight:900;font-size:19px;letter-spacing:.12em;
    text-transform:uppercase;color:#1a1a1a;border-left:2px solid #141414;white-space:nowrap;display:flex;align-items:center}
  .subrow .cell:first-child{border-left:0;padding-left:2px}
  .subrow .cell.loc{flex:0 0 auto;color:#c1452e}
  .subrow .cell .dot{color:#c1452e;margin:0 2px}

  /* ── IMAGE ── */
  .art{margin-top:22px;border:2px solid #141414;line-height:0;box-shadow:0 8px 24px rgba(0,0,0,.25);height:984px;overflow:hidden}
  .art img{width:100%;height:100%;object-fit:cover;object-position:center 86%;display:block;filter:saturate(1.03) contrast(1.02)}
</style></head>
<body>
  <div class="poster">
    <!-- title -->
    <div class="micro">
      <span class="jp">ビルダー・ポップ</span>
      <span class="tag">OPEN CALL</span>
    </div>
    <div class="title">BUILDERS</div>
    <div class="rule"></div>
    <div class="subrow">
      <span class="cell">Gather + Connect</span>
      <span class="cell">Build in Public</span>
      <span class="cell">Ship Together</span>
    </div>

    <!-- illustration -->
    <div class="art"><img src="citypop-builders-scene.png" alt="city pop sunset builders"></div>
  </div>
</body></html>
