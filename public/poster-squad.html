<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toki — Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Archivo:wght@700;800;900&family=Noto+Sans+KR:wght@500;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05060c;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Fredoka",sans-serif}
  .poster{position:relative;width:min(720px,96vw);aspect-ratio:3/4.1;overflow:hidden;background:#080a16;box-shadow:0 30px 80px rgba(0,0,0,.7)}
  .top{position:absolute;left:0;right:0;top:18px;text-align:center;z-index:5;font-family:"Anton";font-size:min(9vw,64px);
    color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.5);letter-spacing:.02em}
  .top b{color:#fff;-webkit-text-stroke:0}
  /* wedges */
  .stage{position:absolute;left:0;right:0;top:74px;bottom:252px;z-index:2}
  .wedge{position:absolute;top:0;bottom:0;width:26%;overflow:hidden}
  .wedge img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 16%}
  .wedge .ov{position:absolute;inset:0;mix-blend-mode:screen;opacity:.6}
  .wedge .dk{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,14,.1),rgba(5,6,14,.85))}
  .wedge .lab{position:absolute;left:0;right:0;bottom:12px;text-align:center;z-index:3;font-family:"Anton";font-size:14px;letter-spacing:.08em;color:#fff;text-shadow:0 2px 8px #000}
  .w1{left:1%;  clip-path:polygon(0 0,72% 0,100% 100%,28% 100%);background:#1b1030}
  .w2{left:21%; clip-path:polygon(0 0,80% 0,72% 100%,0 100%);background:#102036}
  .w3{left:38%; clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);background:#0b2630;z-index:3}
  .w4{left:58%; clip-path:polygon(20% 0,100% 0,100% 100%,28% 100%);background:#241033}
  .w5{left:74%; clip-path:polygon(28% 0,100% 0,72% 100%,0 100%);background:#0e1838}
  .ov1{background:linear-gradient(180deg,#a855f7,#3b1d6e)}.ov2{background:linear-gradient(180deg,#22d3ee,#0e5566)}
  .ov3{background:linear-gradient(180deg,#34e1c4,#0c5a4e)}.ov4{background:linear-gradient(180deg,#c084fc,#5b2a86)}
  .ov5{background:linear-gradient(180deg,#60a5fa,#1e3a8a)}
  /* script title */
  .script{position:absolute;left:0;right:0;top:46%;text-align:center;z-index:6;font-family:"Permanent Marker",cursive;
    font-size:min(13vw,86px);color:#ff4d6d;transform:rotate(-7deg);text-shadow:0 0 18px rgba(255,77,109,.6),3px 3px 0 rgba(0,0,0,.4);line-height:.8}
  .script small{display:block;font-size:.5em;color:#22d3ee;transform:rotate(3deg);margin-top:-6px}
  /* info box */
  .info{position:absolute;left:30px;right:30px;bottom:62px;z-index:6;
    background:rgba(9,11,22,.8);backdrop-filter:blur(12px);border:1px solid rgba(34,211,238,.5);border-radius:10px;padding:12px 18px 13px;
    box-shadow:0 0 50px rgba(34,211,238,.16),inset 0 1px 0 rgba(255,255,255,.06)}
  .info .h{display:flex;align-items:baseline;gap:9px;font-family:"Anton";font-size:20px;color:#fff;letter-spacing:.02em}
  .info .h em{font-family:"Archivo";font-weight:800;font-style:normal;font-size:10px;letter-spacing:.2em;color:#22d3ee}
  .info .squad{font-family:"Archivo";font-weight:800;color:#7fe3f2;font-size:10px;margin-top:2px;letter-spacing:.18em}
  /* ZZZ-style bilingual numbered rows */
  .svc{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;margin-top:9px}
  .row{display:flex;align-items:center;gap:9px;padding:5px 0}
  .row .no{font-family:"Anton";font-size:23px;line-height:.78;color:var(--c);min-width:28px}
  .row .en{font-family:"Archivo";font-weight:800;font-size:12.5px;letter-spacing:.05em;color:#fff}
  .row .kr{font-family:"Noto Sans KR";font-weight:500;font-size:11px;color:#aab6d8;margin-left:auto}
  .c1{--c:#b06bff}.c2{--c:#22d3ee}.c3{--c:#34e1c4}.c4{--c:#c084fc}.c5{--c:#60a5fa}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;border-top:1px solid rgba(34,211,238,.2);padding-top:9px}
  .meta span{font-family:"Archivo";font-weight:700;font-size:10px;letter-spacing:.04em;color:#cdd6e6;padding:3px 9px;border:1px solid rgba(34,211,238,.35);border-radius:4px}
  .meta span b{color:#22d3ee}
  .sale{position:absolute;left:0;right:0;bottom:26px;text-align:center;z-index:6;font-family:"Anton";font-size:30px;color:#fff;letter-spacing:.04em;text-shadow:0 0 14px #22d3ee}
  .sale span{color:#22d3ee}
</style></head>
<body>
  <div class="poster">
    <div class="top">TOKI <b>SQUAD</b></div>
    <div class="stage">
      <div class="wedge w1"><img src="/characters/toki-proud.png" alt=""><div class="ov ov1"></div><div class="dk"></div><div class="lab">스테이킹</div></div>
      <div class="wedge w2"><img src="/characters/toki-welcome.png" alt=""><div class="ov ov2"></div><div class="dk"></div><div class="lab">내 지갑</div></div>
      <div class="wedge w3"><img src="/characters/toki-wink.png" alt=""><div class="ov ov3"></div><div class="dk"></div><div class="lab">프라이빗</div></div>
      <div class="wedge w4"><img src="/characters/toki-thinking.png" alt=""><div class="ov ov4"></div><div class="dk"></div><div class="lab">AI 액세스</div></div>
      <div class="wedge w5"><img src="/characters/toki-cheer.png" alt=""><div class="ov ov5"></div><div class="dk"></div><div class="lab">복권</div></div>
    </div>
    <div class="script">Stake &amp; Play<small>start on-chain</small></div>
    <div class="info">
      <div class="h">토키로 할 수 있는 것 <em>/ TOKI MENU</em></div>
      <div class="squad">TOKI — MINI WALLET &amp; HUB</div>
      <div class="svc">
        <div class="row c1"><span class="no">01</span><span class="en">STAKING</span><span class="kr">스테이킹</span></div>
        <div class="row c2"><span class="no">02</span><span class="en">WALLET</span><span class="kr">내 지갑</span></div>
        <div class="row c3"><span class="no">03</span><span class="en">PRIVATE</span><span class="kr">프라이빗 전송</span></div>
        <div class="row c4"><span class="no">04</span><span class="en">AI ACCESS</span><span class="kr">AI 액세스</span></div>
        <div class="row c5"><span class="no">05</span><span class="en">LOTTERY</span><span class="kr">복권</span></div>
      </div>
      <div class="meta"><span><b>✓</b> 구글로 3초 시작</span><span><b>✓</b> 가스비 걱정 없이</span><span><b>✓</b> 게임처럼 쉽게</span></div>
    </div>
    <div class="sale">지금 <span>NOW LIVE</span> 시작하기!</div>
  </div>
</body></html>
