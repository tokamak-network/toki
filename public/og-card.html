<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TOKI OG Share Card — 1200x630</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bangers&family=Noto+Sans+KR:wght@800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c1020;height:100vh;overflow:hidden;display:grid;place-items:center;font-family:"Archivo Black",sans-serif}
  .card{position:fixed;left:50%;top:50%;width:1200px;height:630px;overflow:hidden;transform:translate(-50%,-50%);transform-origin:center;
    --blue:#1c40d6;--orange:#ffb21e;--brown:#9c4d00;--red:#e8231d;--gold:#f4c021;--cy:#19e0ff;--ink:#0a0a0c}
  .sun{position:absolute;inset:-12%;background:radial-gradient(circle at 32% 36%, #2f5cf0 0%, #1a3ac2 42%, #0e1f78 100%)}
  .dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.5) 18%,transparent 20%);background-size:20px 20px;opacity:.10}
  .glow{position:absolute;left:34%;top:34%;transform:translate(-50%,-50%);width:55%;height:70%;background:radial-gradient(closest-side,rgba(120,170,255,.55),transparent);pointer-events:none}
  .frame{position:absolute;inset:0;border:12px solid var(--red);box-shadow:inset 0 0 0 4px #fff;z-index:60;pointer-events:none}

  /* top tag */
  .tag{position:absolute;left:54px;top:38px;z-index:30;display:inline-flex;align-items:center;gap:12px;font-family:"Anton";font-size:26px;letter-spacing:.06em;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;transform:skewX(-6deg)}
  .tag img{height:30px;transform:skewX(6deg)}
  .tag .star{color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke}

  /* headline */
  .h1{position:absolute;left:50px;top:92px;z-index:30;font-family:"Anton";font-size:62px;letter-spacing:.01em;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke;transform:skewX(-5deg);text-shadow:3px 4px 0 rgba(10,10,12,.35)}
  .h2{position:absolute;left:46px;top:150px;z-index:30;font-family:"Archivo Black";font-size:118px;line-height:.78;color:var(--orange);-webkit-text-stroke:6px var(--ink);paint-order:stroke;
    text-shadow:3px 3px 0 var(--brown),6px 6px 0 var(--brown),9px 9px 0 #6e3600,9px 12px 13px rgba(0,0,0,.45)}
  .badge{position:absolute;left:556px;top:86px;z-index:34;font-family:"Anton";font-size:30px;color:#fff;background:var(--red);padding:8px 18px;letter-spacing:.04em;border:4px solid #fff;box-shadow:0 0 0 4px var(--ink),4px 5px 0 rgba(0,0,0,.3);transform:rotate(-7deg)}

  /* sub + models strip */
  .sub{position:absolute;left:56px;top:302px;z-index:30;font-family:"Noto Sans KR";font-weight:900;font-size:27px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;text-shadow:2px 2px 0 var(--ink)}
  .sub b{color:var(--gold)}
  .models{position:absolute;left:56px;top:352px;z-index:30;display:inline-flex;align-items:center;gap:14px;font-family:"Anton";font-size:24px;letter-spacing:.02em;color:var(--ink);background:#fff;padding:8px 16px;border:4px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);transform:rotate(-1.5deg)}
  .models .mo{color:var(--blue)}
  .models .sep{color:#c9ccd6}

  /* bottom: QR + url */
  .qr{position:absolute;left:56px;bottom:40px;z-index:45;width:120px;background:#fff;border:5px solid var(--ink);border-radius:10px;padding:8px 8px 6px;box-shadow:5px 5px 0 var(--ink);transform:rotate(2deg);display:flex;flex-direction:column;align-items:center}
  .qr img{width:100%;height:auto;display:block;border-radius:2px}
  .qr .lb{font-family:"Anton";font-size:13px;letter-spacing:.06em;color:var(--ink);margin-top:4px;white-space:nowrap}
  .qr .lb i{font-style:normal;color:var(--red)}
  .url{position:absolute;left:196px;bottom:62px;z-index:45;font-family:"Anton";font-size:46px;letter-spacing:.02em;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink)}
  .url small{display:block;font-family:"Noto Sans KR";font-weight:800;font-size:18px;color:var(--cy);-webkit-text-stroke:0;text-shadow:none;letter-spacing:.04em;margin-top:4px}

  /* right: character + burst */
  .burst{position:absolute;right:-30px;top:-40px;z-index:14;width:560px;height:700px;background:#fff;
    clip-path:polygon(50% 0,58% 14%,72% 4%,72% 20%,90% 16%,82% 32%,100% 36%,86% 50%,100% 64%,82% 66%,92% 84%,72% 78%,72% 96%,56% 84%,50% 100%,44% 84%,28% 96%,28% 78%,8% 84%,18% 66%,0 64%,14% 50%,0 36%,18% 32%,10% 16%,28% 20%,28% 4%,42% 14%)}
  .char{position:absolute;right:-70px;bottom:-30px;z-index:18;height:600px;pointer-events:none;
    filter:drop-shadow(3px 0 0 var(--cy)) drop-shadow(-3px 0 0 var(--cy)) drop-shadow(0 3px 0 var(--cy)) drop-shadow(0 -3px 0 var(--cy)) drop-shadow(0 14px 16px rgba(0,0,0,.5))}

  /* caution tape accent */
  .tape{position:absolute;right:-30px;top:330px;width:520px;height:42px;z-index:28;transform:rotate(8deg);
    background:var(--gold);border-top:5px solid #000;border-bottom:5px solid #000;display:flex;align-items:center;overflow:hidden}
  .tape .t{font-family:"Anton";font-size:22px;letter-spacing:.16em;color:#000;white-space:nowrap;padding-left:14px}
  .tape .t b{margin:0 12px}
</style></head>
<body>
  <div class="card">
    <div class="sun"></div><div class="glow"></div><div class="dots"></div>

    <div class="burst"></div>
    <img class="char" src="/characters/toki-surf-action.png" alt="">

    <div class="tag"><span class="star">★</span><img src="/toki-logo.png" alt="">TOKAMAK · TOKI — SUMMER UPDATE</div>

    <div class="h1">STAKE 100 TON →</div>
    <div class="h2">FREE AI KEY</div>
    <div class="badge">AI MEMBERSHIP</div>

    <div class="sub"><b>Unlimited</b> use — up to 1M output tokens / day</div>
    <div class="models"><span class="mo">QWEN 3.6 · GEMMA 4</span><span class="sep">▕</span>NO CARD · NO FEE</div>

    <div class="qr"><img src="/qr-toki.png" alt="toki.tokamak.network"><span class="lb">SCAN TO <i>START</i></span></div>
    <div class="url">toki.tokamak.network<small>START WITH STAKING · ROAM THE ECOSYSTEM</small></div>

    <div class="frame"></div>
  </div>
<script>(function(){var c=document.querySelector('.card');function f(){var s=Math.min((innerWidth-24)/1200,(innerHeight-24)/630);c.style.transform='translate(-50%,-50%) scale('+s+')';}addEventListener('resize',f);f();})();</script>
</body></html>
